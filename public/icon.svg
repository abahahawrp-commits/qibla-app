<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071914" />
      <stop offset="50%" stop-color="#0d2a23" />
      <stop offset="100%" stop-color="#081c17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for maskable safe-zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Islamic geometric circle ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" />

  <!-- Crescent Moon -->
  <path d="M 285 130 C 205 130 140 195 140 275 C 140 355 205 420 285 420 C 322 420 356 406 382 383 C 310 388 245 330 245 258 C 245 192 300 138 368 135 C 343 132 313 130 285 130 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Central Star / Compass North Spark -->
  <path d="M 345 185 L 354 212 L 381 216 L 360 234 L 366 261 L 343 246 L 320 260 L 327 233 L 307 215 L 334 212 Z" fill="url(#goldGrad)" />

  <!-- Rehal / Book Stand Base -->
  <polygon points="215,350 297,350 256,380" fill="#f59e0b" opacity="0.8" />
</svg>
